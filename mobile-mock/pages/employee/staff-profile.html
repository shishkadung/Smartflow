<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=414, initial-scale=1" />
  <title>SmartFlow — Staff Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />

    <div class="sf-device__shell">
      <div class="sf-device__btn sf-device__btn--silent"></div>
      <div class="sf-device__btn sf-device__btn--vol-up"></div>
      <div class="sf-device__btn sf-device__btn--vol-down"></div>
      <div class="sf-device__btn sf-device__btn--power"></div>
      <div class="sf-device__screen">
        <div class="sf-shell-chrome">
          <header class="sf-status-bar sf-status-bar--on-navy">
            <span class="sf-status-bar__time">9:41</span>
            <div class="sf-status-bar__island"></div>
            <div class="sf-status-bar__icons">
              <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="4.5" y="5" width="3" height="7" rx="0.5"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.5"/><rect x="13.5" y="0" width="2.5" height="12" rx="0.5" opacity="0.35"/></svg>

              <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="currentColor" stroke-opacity="0.4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><path d="M24 4.5v4a2 2 0 000-4z" fill="currentColor" opacity="0.4"/></svg>
            </div>
          </header>
          <header class="sf-shell-topbar">
            <img class="sf-muni-seal sf-muni-seal--on-navy" src="../../assets/brand/urbiztondo_seal.png" width="36" height="36" alt="" />
            <div class="sf-shell-topbar__text">
              <div class="sf-shell-topbar__office">Engineering Office</div>
              <div class="sf-wordmark sf-wordmark--on-dark">
                <span class="sf-wordmark__smart">Smart</span><span class="sf-wordmark__flow">Flow</span>
              </div>
            </div>
            <button class="sf-shell-icon" type="button" aria-label="How to use this page"><span class="sf-icon" data-icon="help"></span></button>
            <a class="sf-shell-icon" href="staff-requests.html" aria-label="Document requests"><span class="sf-icon" data-icon="swap"></span></a>
            <a class="sf-office-badge sf-office-badge--on-navy" href="staff-profile.html">ENG</a>
          </header>
        </div>

        <div class="sf-phone">
          <div class="sf-phone__scroll">
            <div class="sf-overview-card">
              <h2 class="sf-overview-card__title">Profile</h2>
              <p class="sf-overview-card__body">Your office account and desk stats.</p>
            </div>

            <div class="sf-form-card" style="margin-top:14px;">
              <div style="display:flex;gap:14px;align-items:flex-start;">
                <div class="sf-profile-avatar" style="width:72px;height:72px;border-radius:16px;font-size:22px;">AC</div>
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:800;font-size:16px;color:var(--sf-navy);">Ana Cruz</div>
                  <div style="font-size:12.5px;font-weight:600;margin-top:4px;">Clerk · Engineering Office (ENG)</div>
                  <div style="font-size:12px;color:var(--sf-muted);margin-top:4px;">@acruz</div>
                </div>
                <span class="sf-office-badge">ENG</span>
              </div>
              <hr style="border:0;border-top:1px solid var(--sf-border);margin:14px 0 12px;" />
              <p style="font-size:12px;font-weight:700;color:var(--sf-muted);margin:0 0 10px;">Today's desk (your office)</p>
              <div class="sf-stat-row" style="margin:0;">
                <div class="sf-stat-cell sf-stat-cell--desk">
                  <div class="sf-stat-cell__value sf-stat-cell__value--green">4</div>
                  <div class="sf-stat-cell__label">Received</div>
                </div>
                <div class="sf-stat-cell">
                  <div class="sf-stat-cell__value">2</div>
                  <div class="sf-stat-cell__label">Sent</div>
                </div>
                <div class="sf-stat-cell sf-stat-cell--desk">
                  <div class="sf-stat-cell__value sf-stat-cell__value--blue">3</div>
                  <div class="sf-stat-cell__label">On desk</div>
                </div>
              </div>
            </div>

            <a class="sf-btn-primary sf-btn-primary--navy" href="staff-profile-security.html" style="display:block;text-align:center;text-decoration:none;margin-top:16px;padding:14px;">Account &amp; security</a>
            <p class="sf-profile-foot">SmartFlow · Municipality of Urbiztondo</p>
          </div>

          <nav class="sf-bottom-nav">
            <a class="sf-nav-item" href="staff-home.html"><div class="sf-nav-item__icon"><span class="sf-icon" data-icon="home"></span></div><span class="sf-nav-item__label">Home</span></a>
            <a class="sf-nav-item sf-nav-item--elevated" href="staff-scan.html"><div class="sf-nav-item__icon"><span class="sf-icon" data-icon="scan"></span></div><span class="sf-nav-item__label">Scan</span></a>
            <a class="sf-nav-item" href="staff-alerts.html"><div class="sf-nav-item__icon-wrap"><div class="sf-nav-item__icon"><span class="sf-icon" data-icon="alert"></span></div><span class="sf-nav-item__badge">2</span></div><span class="sf-nav-item__label">Alerts</span></a>
            <a class="sf-nav-item" href="staff-menu.html"><div class="sf-nav-item__icon"><span class="sf-icon" data-icon="more"></span></div><span class="sf-nav-item__label">Menu</span></a>
          </nav>
        </div>
        <div class="sf-home-indicator" aria-hidden="true"></div>
      </div>

  <script src="../../js/figma-fit.js"></script>

</html>
