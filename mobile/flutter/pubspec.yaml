name: smartflow
description: SmartFlow — QR document tracking for Municipality of Urbiztondo
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  go_router: ^17.5.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.1.2
  intl: ^0.20.3
  google_fonts: ^8.2.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  image_picker_platform_interface: any
flutter:
  uses-material-design: true
  assets:
    - assets/brand/urbiztondo_seal.png
