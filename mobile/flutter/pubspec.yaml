name: smartflow
description: SmartFlow — QR document tracking for Municipality of Urbiztondo
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  go_router: ^14.6.2
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/urbiztondo_seal.png
