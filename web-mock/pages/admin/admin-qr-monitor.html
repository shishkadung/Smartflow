<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>SmartFlow Web — QR monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
</head>
<body class="sf-web-page">

  <div class="sf-web-canvas" id="figma-export">
    <header class="sf-web-topbar">
      <img src="../../assets/brand/urbiztondo_seal.png" width="34" height="34" alt="" />
      <div><div class="sf-web-topbar__office">Accounting Office</div><div class="sf-web-topbar__brand"><span>Smart</span><span>Flow</span></div></div>
      <div class="sf-web-topbar__spacer"></div><span class="sf-web-badge">ACC</span>
    </header>
    <div class="sf-web-body">
      <nav class="sf-web-nav"><a class="" href="#">Home</a><a class="" href="#">Scan</a><a class="" href="#">COA</a><a class="" href="#">Users</a><a class="" href="#">Offices</a><a class="" href="#">Thresholds</a><a class="is-active" href="#">QR monitor</a><a class="" href="#">System</a><a class="" href="#">Profile</a></nav>
      <main class="sf-web-main">
        <h1 class="sf-web-title">QR monitor</h1>
        <p class="sf-web-sub">Accepted and rejected scans (last 48 hours).</p>
        <div class="sf-web-stat-row">
    <div class="sf-web-stat"><div class="sf-web-stat__value sf-web-stat__value--green">86</div><div class="sf-web-stat__label">Accepted</div></div>
    <div class="sf-web-stat"><div class="sf-web-stat__value sf-web-stat__value--red">7</div><div class="sf-web-stat__label">Rejected</div></div>
    <div class="sf-web-stat"><div class="sf-web-stat__value">93</div><div class="sf-web-stat__label">Total</div></div>
  </div>
  <div class="sf-web-card"><table class="sf-web-table">
    <thead><tr><th>Outcome</th><th>Document</th><th>Office</th><th>Reason</th></tr></thead>
    <tbody>
      <tr><td><span class="sf-web-pill sf-web-pill--in">OK</span></td><td>DOC-2026-000003</td><td>ENG</td><td>—</td></tr>
      <tr><td><span class="sf-web-pill sf-web-pill--out">Reject</span></td><td>DOC-2026-000011</td><td>ENG</td><td>HMAC expired</td></tr>
    </tbody></table></div>
      </main>
    </div>
  </div>
</body>
</html>
