<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>SmartFlow Web — COA</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
</head>
<body class="sf-web-page">
  <div class="sf-web-canvas" id="figma-export">
    <header class="sf-web-topbar">
      <img src="../../assets/brand/urbiztondo_seal.png" width="34" height="34" alt="" />
      <div><div class="sf-web-topbar__office">Accounting Office</div><div class="sf-web-topbar__brand"><span>Smart</span><span>Flow</span></div></div>
      <div class="sf-web-topbar__spacer"></div><span class="sf-web-badge">ACC</span>
    </header>
    <div class="sf-web-body">
      <nav class="sf-web-nav">
        <a href="#">Home</a><a href="#">Scan</a><a class="is-active" href="#">COA</a><a href="#">Users</a><a href="#">Offices</a><a href="#">Thresholds</a><a href="#">System</a>
      </nav>
      <main class="sf-web-main">
        <h1 class="sf-web-title">COA reports</h1>
        <p class="sf-web-sub">Monthly handoff metrics from scan logs — not a financial review.</p>
        <div class="sf-web-card" style="background:linear-gradient(135deg,#0b1f3a,#1d4ed8);color:#fff;border:0;">
          <div style="font-size:12px;opacity:0.8;">September 2026 · Municipality of Urbiztondo</div>
          <div style="display:flex;gap:28px;margin-top:14px;">
            <div><div style="font-size:28px;font-weight:800;">72%</div><div style="font-size:11px;opacity:0.8;">On time</div></div>
            <div><div style="font-size:28px;font-weight:800;">18%</div><div style="font-size:11px;opacity:0.8;">Delayed</div></div>
            <div><div style="font-size:28px;font-weight:800;">64</div><div style="font-size:11px;opacity:0.8;">Docs</div></div>
          </div>
          <button class="sf-web-btn" type="button" style="margin-top:14px;background:#fff;color:var(--sf-navy);">Copy summary</button>
        </div>
        <div class="sf-web-stat-row" style="margin-top:12px;">
          <div class="sf-web-stat"><div class="sf-web-stat__value sf-web-stat__value--green">72%</div><div class="sf-web-stat__label">On time</div></div>
          <div class="sf-web-stat"><div class="sf-web-stat__value sf-web-stat__value--blue">10%</div><div class="sf-web-stat__label">Unforwarded</div></div>
          <div class="sf-web-stat"><div class="sf-web-stat__value sf-web-stat__value--red">18%</div><div class="sf-web-stat__label">Delayed</div></div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
