<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>SmartFlow Web — Head Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
</head>
<body class="sf-web-page">
  <div class="sf-web-canvas" id="figma-export">
    <header class="sf-web-topbar">
      <img src="../../assets/brand/urbiztondo_seal.png" width="34" height="34" alt="" />
      <div><div class="sf-web-topbar__office">Engineering Office</div><div class="sf-web-topbar__brand"><span>Smart</span><span>Flow</span></div></div>
      <div class="sf-web-topbar__spacer"></div><span class="sf-web-badge">ENG</span>
    </header>
    <div class="sf-web-body">
      <nav class="sf-web-nav">
        <a class="is-active" href="#">Home</a><a href="#">Queue</a><a href="#">Alerts</a><a href="#">Analytics</a><a href="#">History</a><a href="#">Profile</a>
      </nav>
      <main class="sf-web-main">
        <h1 class="sf-web-title">Office overview</h1>
        <p class="sf-web-sub">Snapshot of folders at your office.</p>
        <div class="sf-web-stat-row">
          <div class="sf-web-stat"><div class="sf-web-stat__value sf-web-stat__value--blue">12</div><div class="sf-web-stat__label">In office</div></div>
          <div class="sf-web-stat"><div class="sf-web-stat__value sf-web-stat__value--red">2</div><div class="sf-web-stat__label">Overdue</div></div>
          <div class="sf-web-stat"><div class="sf-web-stat__value">4.2h</div><div class="sf-web-stat__label">Avg time</div></div>
        </div>
        <div class="sf-web-card">
          <h3 style="margin:0 0 10px;font-size:13px;">Overdue</h3>
          <table class="sf-web-table">
            <thead><tr><th>ID</th><th>Title</th><th>Wait</th></tr></thead>
            <tbody>
              <tr><td>DOC-2026-000003</td><td>DV — San Gregorio</td><td><span class="sf-web-pill sf-web-pill--out">52h</span></td></tr>
              <tr><td>DOC-2026-000009</td><td>POW — covered court</td><td><span class="sf-web-pill sf-web-pill--warn">40h</span></td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
