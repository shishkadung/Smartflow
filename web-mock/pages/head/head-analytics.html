<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>SmartFlow Web — Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
</head>
<body class="sf-web-page">

  <div class="sf-web-canvas" id="figma-export">
    <header class="sf-web-topbar">
      <img src="../../assets/brand/urbiztondo_seal.png" width="34" height="34" alt="" />
      <div><div class="sf-web-topbar__office">Engineering Office</div><div class="sf-web-topbar__brand"><span>Smart</span><span>Flow</span></div></div>
      <div class="sf-web-topbar__spacer"></div><span class="sf-web-badge">ENG</span>
    </header>
    <div class="sf-web-body">
      <nav class="sf-web-nav"><a class="" href="#">Home</a><a class="" href="#">Queue</a><a class="" href="#">Alerts</a><a class="is-active" href="#">Analytics</a><a class="" href="#">Register</a><a class="" href="#">History</a><a class="" href="#">Profile</a></nav>
      <main class="sf-web-main">
        <h1 class="sf-web-title">Analytics</h1>
        <p class="sf-web-sub">On-time rate and slow documents for your office.</p>
        <div class="sf-web-stat-row">
    <div class="sf-web-stat"><div class="sf-web-stat__value sf-web-stat__value--green">78%</div><div class="sf-web-stat__label">On time</div></div>
    <div class="sf-web-stat"><div class="sf-web-stat__value sf-web-stat__value--blue">12%</div><div class="sf-web-stat__label">Unforwarded</div></div>
    <div class="sf-web-stat"><div class="sf-web-stat__value sf-web-stat__value--red">10%</div><div class="sf-web-stat__label">Delayed</div></div>
  </div>
  <div class="sf-web-card">
    <h3 style="margin:0 0 8px;font-size:13px;">Slow documents · September 2026</h3>
    <table class="sf-web-table"><thead><tr><th>ID</th><th>Type</th><th>Hours</th></tr></thead>
    <tbody><tr><td>DOC-2026-000003</td><td>DV</td><td>52h</td></tr><tr><td>DOC-2026-000009</td><td>POW</td><td>40h</td></tr></tbody></table>
  </div>
      </main>
    </div>
  </div>
</body>
</html>
