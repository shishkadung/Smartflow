<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>SmartFlow Web — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
</head>
<body class="sf-web-page">
  <div class="sf-web-canvas" id="figma-export">
    <div class="sf-web-auth">
      <div class="sf-web-auth__hero">
        <img src="../../assets/brand/urbiztondo_seal.png" width="56" height="56" alt="" style="margin-bottom:16px;" />
        <div style="font-size:12px;font-weight:700;opacity:0.75;margin-bottom:8px;">Official portal · Authorized users</div>
        <div style="font-family:var(--sf-display);font-size:28px;font-weight:700;margin-bottom:8px;">Smart<span style="color:#93c5fd;">Flow</span></div>
        <p style="font-size:14px;line-height:1.5;opacity:0.9;max-width:32ch;">Secure QR handoffs and custody records for the Municipality of Urbiztondo.</p>
      </div>
      <div class="sf-web-auth__form-wrap">
        <h1 class="sf-web-title">Sign in</h1>
        <p class="sf-web-sub">Use your municipal account.</p>
        <div class="sf-web-field"><label>Username</label><input value="engineering.staff" /></div>
        <div class="sf-web-field"><label>Password</label><input type="password" value="••••••••••••" /></div>
        <button class="sf-web-btn" type="button" style="width:100%;margin-top:8px;">Sign in</button>
        <p style="font-size:12px;color:var(--sf-muted);margin-top:14px;">Forgot password? · Request access</p>
      </div>
    </div>
  </div>
</body>
</html>
