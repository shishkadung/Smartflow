<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>SmartFlow Web — Scan</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
</head>
<body class="sf-web-page">
  <div class="sf-web-canvas" id="figma-export">
    <header class="sf-web-topbar">
      <img src="../../assets/brand/urbiztondo_seal.png" width="34" height="34" alt="" />
      <div><div class="sf-web-topbar__office">Engineering Office</div><div class="sf-web-topbar__brand"><span>Smart</span><span>Flow</span></div></div>
      <div class="sf-web-topbar__spacer"></div><span class="sf-web-badge">ENG</span>
    </header>
    <div class="sf-web-body">
      <nav class="sf-web-nav">
        <a href="#">Home</a><a class="is-active" href="#">Scan</a><a href="#">Register</a><a href="#">Requests</a><a href="#">History</a><a href="#">Alerts</a><a href="#">Profile</a>
      </nav>
      <main class="sf-web-main">
        <h1 class="sf-web-title">Scan</h1>
        <p class="sf-web-sub">Mark IN when a folder arrives · OUT when you send it.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
          <div class="sf-web-card" style="min-height:280px;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <div style="font-size:11px;font-weight:800;letter-spacing:0.06em;opacity:0.7;margin-bottom:12px;">LIVE SCAN</div>
            <div style="width:160px;height:160px;border:2px solid rgba(147,197,253,0.5);border-radius:12px;"></div>
            <p style="font-size:12px;opacity:0.75;margin-top:14px;">Align folder QR inside the frame</p>
          </div>
          <div class="sf-web-card">
            <div style="font-size:12px;font-weight:700;margin-bottom:10px;">Or enter tracking ID</div>
            <div class="sf-web-field"><input placeholder="Enter tracking ID" value="DOC-2026-000003" /></div>
            <button class="sf-web-btn" type="button" style="width:100%;">Look up document</button>
            <div style="margin-top:16px;font-size:11px;font-weight:700;color:var(--sf-muted);">Recent</div>
            <p style="font-size:12px;margin:8px 0 0;">DOC-2026-000003 · DOC-2026-000001</p>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
