<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>SmartFlow Web — Alerts</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
</head>
<body class="sf-web-page">
  <div class="sf-web-canvas" id="figma-export">
    <header class="sf-web-topbar">
      <img src="../../assets/brand/urbiztondo_seal.png" width="34" height="34" alt="" />
      <div><div class="sf-web-topbar__office">Engineering Office</div><div class="sf-web-topbar__brand"><span>Smart</span><span>Flow</span></div></div>
      <div class="sf-web-topbar__spacer"></div><span class="sf-web-badge">ENG</span>
    </header>
    <div class="sf-web-body">
      <nav class="sf-web-nav">
        <a href="#">Home</a><a href="#">Scan</a><a href="#">Register</a><a href="#">Requests</a><a href="#">History</a><a class="is-active" href="#">Alerts</a><a href="#">Profile</a>
      </nav>
      <main class="sf-web-main">
        <h1 class="sf-web-title">Alerts</h1>
        <p class="sf-web-sub">Overdue folders, or OUT from ENG with no receive yet.</p>
        <div class="sf-web-stat-row">
          <div class="sf-web-stat"><div class="sf-web-stat__value sf-web-stat__value--red">1</div><div class="sf-web-stat__label">Delayed</div></div>
          <div class="sf-web-stat"><div class="sf-web-stat__value" style="color:var(--sf-gold);">1</div><div class="sf-web-stat__label">Due soon</div></div>
          <div class="sf-web-stat"><div class="sf-web-stat__value sf-web-stat__value--blue">0</div><div class="sf-web-stat__label">Unconfirmed</div></div>
        </div>
        <div class="sf-web-card" style="border-left:4px solid var(--sf-red);">
          <div style="display:flex;justify-content:space-between;gap:12px;">
            <div>
              <strong style="font-size:13px;">DV — Barangay San Gregorio</strong>
              <div style="font-size:11px;color:var(--sf-muted);margin-top:4px;">DOC-2026-000003 · 52h on desk · threshold 48h</div>
            </div>
            <span class="sf-web-pill sf-web-pill--out">Still on desk</span>
          </div>
          <div style="margin-top:12px;display:flex;gap:8px;">
            <button class="sf-web-btn" type="button">Open</button>
            <button class="sf-web-btn sf-web-btn--outline" type="button">Later</button>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
