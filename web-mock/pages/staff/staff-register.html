<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>SmartFlow Web — Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
</head>
<body class="sf-web-page">
  <div class="sf-web-canvas" id="figma-export">
    <header class="sf-web-topbar">
      <img src="../../assets/brand/urbiztondo_seal.png" width="34" height="34" alt="" />
      <div><div class="sf-web-topbar__office">Engineering Office</div><div class="sf-web-topbar__brand"><span>Smart</span><span>Flow</span></div></div>
      <div class="sf-web-topbar__spacer"></div><span class="sf-web-badge">ENG</span>
    </header>
    <div class="sf-web-body">
      <nav class="sf-web-nav">
        <a href="#">Home</a><a href="#">Scan</a><a class="is-active" href="#">Register</a><a href="#">Requests</a><a href="#">History</a><a href="#">Alerts</a><a href="#">Profile</a>
      </nav>
      <main class="sf-web-main">
        <h1 class="sf-web-title">Register</h1>
        <p class="sf-web-sub">Only when the folder is already in your custody.</p>
        <div class="sf-web-card" style="max-width:520px;">
          <div class="sf-web-field"><label>Document type</label>
            <select><option selected>Disbursement Voucher</option><option>Others</option></select>
          </div>
          <div class="sf-web-field"><label>Title</label><input value="Barangay San Gregorio road repair" /></div>
          <div class="sf-web-field"><label>Logbook / reference</label><input placeholder="Optional" /></div>
          <button class="sf-web-btn sf-web-btn--navy" type="button">Register &amp; get QR</button>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
